# Example deployment: app + PostgreSQL. Put a TLS-terminating reverse proxy in front (COOKIE_SECURE=true requires HTTPS).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: borrowings
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: borrowings
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U borrowings"], interval: 5s, retries: 10 }
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://borrowings:${DB_PASSWORD}@db:5432/borrowings
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY (openssl rand -base64 32)}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      PRICE_PROVIDER: manual
    volumes: [documents:/app/storage/documents]
    ports: ["127.0.0.1:4000:4000"]
volumes: { dbdata: {}, documents: {} }
